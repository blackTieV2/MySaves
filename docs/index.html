<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>King, Warrior, Magician, Lover</title>
  <meta name="description" content="A readable web edition of King, Warrior, Magician, Lover.">
  <style>
    :root {
      --page: #f3f4f6;
      --paper: #ffffff;
      --ink: #242424;
      --muted: #666;
      --rule: #d0d7de;
      --link: #0969da;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
      line-height: 1.65;
    }
    main {
      width: min(980px, calc(100% - 2rem));
      margin: 2rem auto;
      padding: 2.5rem 3rem 5rem;
      background: var(--paper);
      box-shadow: 0 1px 8px rgba(0,0,0,.12);
      overflow: hidden;
    }
    h1, h2, h3, h4, h5, h6 {
      line-height: 1.25;
      scroll-margin-top: 1rem;
    }
    a { color: var(--link); }
    img {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 1.25rem auto 0;
    }
    img[src$=".svg"], img[src*=".svg?"] {
      width: 100%;
      max-height: 88vh;
      object-fit: contain;
      background: #fff;
    }
    figure { margin: 1.5rem 0 2rem; }
    figure img { margin-bottom: .3rem; }
    figcaption {
      margin-top: 0;
      color: var(--muted);
      font-size: .88rem;
      line-height: 1.3;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 1rem 0 1.5rem;
    }
    th, td {
      border: 1px solid var(--rule);
      padding: .45rem .65rem;
      vertical-align: top;
    }
    table img[src$=".svg"] {
      width: 100%;
      max-height: 560px;
    }
    blockquote {
      margin-left: 0;
      padding-left: 1rem;
      border-left: 4px solid var(--rule);
      color: var(--muted);
    }
    hr { border: 0; border-top: 1px solid var(--rule); }
    pre {
      overflow-x: auto;
      padding: 1rem;
      border: 1px solid var(--rule);
      border-radius: 6px;
    }
    .loading, .error {
      font-family: system-ui, sans-serif;
      color: var(--muted);
    }
    @media (max-width: 700px) {
      body { font-size: 16px; }
      main {
        width: 100%;
        margin: 0;
        padding: 1.25rem 1rem 3rem;
        box-shadow: none;
      }
      table, tbody, tr, td { display: block; width: 100%; }
      td { border: 0; padding: .25rem 0; }
    }
  </style>
</head>
<body>
  <main id="publication">
    <p class="loading">Loading publication…</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    (async () => {
      const target = document.getElementById('publication');
      const markdownFile = './Moore,R(1990)_King_Warrior_Magician_Lover.md';

      try {
        const response = await fetch(markdownFile, { cache: 'no-cache' });
        if (!response.ok) throw new Error(`Markdown request failed: ${response.status}`);

        const markdown = await response.text();
        marked.setOptions({ gfm: true, breaks: false, headerIds: true, mangle: false });
        target.innerHTML = marked.parse(markdown);

        /* Keep image paths relative to /docs. This allows GitHub Pages to serve
           the SVG/JPEG files copied into docs instead of bypassing them through
           raw.githubusercontent.com. */
        for (const image of target.querySelectorAll('img')) {
          image.loading = 'lazy';
          image.decoding = 'async';
          if (!image.hasAttribute('alt')) image.alt = '';
        }

        for (const link of target.querySelectorAll('a[href^="#"]')) {
          link.addEventListener('click', event => {
            const id = decodeURIComponent(link.getAttribute('href').slice(1));
            const destination = document.getElementById(id) || document.querySelector(`[name="${CSS.escape(id)}"]`);
            if (destination) {
              event.preventDefault();
              destination.scrollIntoView({ behavior: 'smooth', block: 'start' });
              history.replaceState(null, '', `#${encodeURIComponent(id)}`);
            }
          });
        }
      } catch (error) {
        target.innerHTML = `<p class="error"><strong>The publication could not be loaded.</strong><br>${error.message}</p>`;
        console.error(error);
      }
    })();
  </script>
</body>
</html>
