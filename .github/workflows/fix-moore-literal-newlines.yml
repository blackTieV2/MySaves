name: Fix Moore conversion breaks

on:
  push:
    paths:
      - '.github/workflows/fix-moore-literal-newlines.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair conversion newline and page-break artifacts
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          path = Path('Moore, R (1990) King Warrior Magician Lover/Moore,R(1990)_King_Warrior_Magician_Lover.md')
          text = path.read_text(encoding='utf-8')
          original = text

          # Literal newline markers produced by conversion.
          text = text.replace('\\r\\n', '\n').replace('\\n', '\n')
          text = re.sub(r'(?<![A-Za-z0-9])/n(?![A-Za-z0-9])', '\n', text)
          text = text.replace('\r\n', '\n').replace('\r', '\n')

          # Join false paragraph breaks introduced at page boundaries.
          # Only join where the next paragraph begins in lowercase and the previous
          # paragraph does not look complete or structural.
          structural = re.compile(r'^(?:#{1,6}\s|[-*+]\s|\d+[.)]\s|>|<|!\[|\|)')
          lines = text.split('\n')
          out = []
          i = 0
          joined = 0

          while i < len(lines):
              if i + 2 < len(lines) and lines[i].strip() and not lines[i+1].strip() and lines[i+2].strip():
                  left = lines[i].rstrip()
                  right = lines[i+2].lstrip()

                  left_complete = bool(re.search(r'[.!?…””\)\]]$', left))
                  safe_right = bool(re.match(r'^[a-z]', right)) and not structural.match(right)
                  safe_left = not structural.match(left.lstrip()) and not left.endswith(('>', '|'))

                  if safe_left and safe_right and not left_complete:
                      if left.endswith('-'):
                          out.append(left[:-1] + right)
                      else:
                          out.append(left + ' ' + right)
                      joined += 1
                      i += 3
                      continue

              out.append(lines[i])
              i += 1

          text = '\n'.join(out)

          if text != original:
              path.write_text(text, encoding='utf-8', newline='\n')
          print(f'Repaired {joined} false page-break paragraph split(s).')
          PY

      - name: Commit cleaned Markdown
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'Moore, R (1990) King Warrior Magician Lover/Moore,R(1990)_King_Warrior_Magician_Lover.md'
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Repair page-break artifacts in combined Moore Markdown'
          git push
